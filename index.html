<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos López | Portafolio Profesional</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Open Sans', sans-serif;
            background: #F8F9FA;
            color: #14213D;
        }

        .container {
            padding: 40px 25px;
            max-width: 800px;
        }

        .logo {
            width: 160px;
            height: 160px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: #14213D;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: #55ACE0;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            margin-bottom: 8px;
        }

        .role {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            color: #3989BA;
            margin-bottom: 30px;
        }

        .slogan {
            font-size: 22px;
            margin-bottom: 45px;
        }

        .construction {
            display: inline-block;
            padding: 12px 28px;
            border: 2px solid #3989BA;
            border-radius: 30px;
            color: #14213D;
            font-weight: 600;
        }

        footer {
            margin-top: 60px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            C&lt;/&gt;
        </div>

        <h1>Carlos López</h1>

        <p class="role">
            SOFTWARE DEVELOPER | FULL STACK
        </p>

        <p class="slogan">
            Código que convierte ideas en soluciones.
        </p>

        <div class="construction">
            Portafolio en construcción
        </div>

        <footer>
            © 2026 Carlos López
        </footer>

    </main>

</body>
</html>
